name: Aperçu web

# Publie la version web de l'agenda sur GitHub Pages à chaque push,
# pour pouvoir la tester depuis un téléphone sans rien installer.

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export web
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
        run: |
          npx expo export --platform web --output-dir dist
          node scripts/finish-web.mjs
      - name: Éviter le traitement Jekyll
        run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
