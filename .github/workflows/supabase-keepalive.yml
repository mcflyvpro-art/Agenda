name: Garder Supabase éveillé

# Un projet Supabase gratuit se met en pause après 7 jours sans la
# moindre requête API. Ce workflow lui envoie un signe de vie deux fois
# par semaine — largement sous la barre des 7 jours — pour qu'il ne
# s'endorme jamais, même si l'app elle-même n'est pas ouverte.

on:
  schedule:
    - cron: '0 8 * * 1,4' # lundi et jeudi, 8h UTC
  workflow_dispatch: {} # bouton "Run workflow" pour tester à la main

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Requête vers l'API Supabase
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL ou SUPABASE_ANON_KEY manquant dans les secrets du dépôt."
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/events?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Réponse Supabase : $code"
          # peu importe le code (401/200) : c'est la requête elle-même qui compte comme activité
          if [ "$code" = "000" ]; then
            echo "::error::Aucune réponse du projet Supabase."
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
